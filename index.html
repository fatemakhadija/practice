<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safai Abhyaan Mission! 🧹</title>
  
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      
      /* --- NEW BACKGROUND: CSS ONLY (No Image Link to Break!) --- */
      /* Creates a dirty floor look using gradients */
      background-color: #5d4037;
      background-image: 
        radial-gradient(#795548 15%, transparent 16%),
        radial-gradient(#8d6e63 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Dark vignette overlay to focus on the center */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.6) 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* --- FLOATING TRASH ANIMATION --- */
    #trash-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0; 
      overflow: hidden;
    }

    .bg-item {
      position: absolute;
      top: -15%; /* Start slightly higher */
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
      /* Add a glow to make them visible */
      filter: drop-shadow(0px 0px 5px rgba(255,255,255,0.3)); 
    }

    /* --- DUSTBIN CARD --- */
    .dustbin-card {
      background-color: #616161; /* Grey Bin */
      /* Plastic Texture */
      background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.2) 20px, rgba(0,0,0,0.2) 25px);
      
      border-radius: 10px 10px 40px 40px;
      border-top: 25px solid #424242; /* Lid Rim */
      border-bottom: 8px solid #424242;
      
      padding: 25px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.9);
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 90%;
      width: 380px;
      color: white;
    }

    /* Bin Handles */
    .dustbin-card::before, .dustbin-card::after {
        content: '';
        position: absolute;
        top: 60px;
        width: 12px;
        height: 35px;
        background: #424242;
        border-radius: 4px;
        box-shadow: inset 1px 1px 3px rgba(0,0,0,0.5);
    }
    .dustbin-card::before { left: -12px; }
    .dustbin-card::after { right: -12px; }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #fff;
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px #000;
      line-height: 1.3;
      border-bottom: 2px dashed rgba(255,255,255,0.3);
      padding-bottom: 15px;
    }

    .btn-container {
      position: relative;
      height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-custom {
      border-radius: 10px;
      padding: 10px 25px;
      font-size: 1rem;
      font-family: 'Fredoka One', cursive;
      border: 2px solid #bdbdbd;
      box-shadow: 0 5px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    #yesBtn {
      background-color: #757575;
      color: #fff; 
      z-index: 100;
    }
    
    #noBtn {
      background-color: #d84315; /* Orange */
      color: #fff;
      position: absolute; 
      right: 5px; 
      z-index: 9999;
      transition: none; 
      white-space: normal; 
      max-width: 130px;
      font-size: 0.85rem;
      line-height: 1.1;
      padding: 8px 12px;
    }

    #success-container {
      display: none;
      text-align: center;
      z-index: 20;
    }

    #success-container h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #ffca28; /* Gold */
      margin-top: 25px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #000;
    }

    .image-composite {
        position: relative;
        width: 250px;
        height: 250px;
        margin: 0 auto;
        background: #fff;
        padding: 6px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        transform: rotate(-2deg);
    }

    .main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* --- BROOM ICON (Made Bigger & On Top) --- */
    .broom-overlay {
        position: absolute;
        bottom: -30px;
        right: -50px;
        width: 160px; /* Bigger */
        transform: rotate(-15deg);
        filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.5));
        z-index: 100; /* Ensure it's on top of photo */
        pointer-events: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 99999; /* Max Z-Index to stay on top */
    }
  </style>
</head>
<body>

  <div class="overlay"></div>
  
  <div id="trash-container"></div>
  
  <canvas id="confetti-canvas"></canvas>

  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%;">
    
    <div class="dustbin-card" id="main-content">
      <h1>Miss Taiba jhadu safai abhyaan hai? 🧹🧐</h1>
      
      <div class="btn-container">
        <button id="yesBtn" class="btn btn-custom">Haan hu! 😤</button>
        
        <button id="noBtn" class="btn btn-custom">Nahi...</button>
      </div>
    </div>

    <div class="dustbin-card" id="success-container">
      
      <div class="image-composite">
          <img src="image_2.jpg" alt="Taiba" class="main-photo">
          
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Broom_icon.svg/512px-Broom_icon.svg.png" alt="Jhadu" class="broom-overlay">
      </div>
      
      <h2>Safai maharani Taiba!!! 👑🧹</h2>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    $(document).ready(function() {
      
      // --- ANIMATED BACKGROUND: FALLING TRASH ---
      const items = ['🧹', '💨', '🗑️', '💩', '🦠', '🧽', '🥡', '🧴', '🍌', '📄', '🪰'];
      
      function createBgItem() {
        const item = $('<div class="bg-item"></div>');
        item.text(items[Math.floor(Math.random() * items.length)]);
        
        // Randomize start position
        var leftPos = Math.random() * 100; // 0 to 100% width
        var size = Math.random() * 40 + 20; // Bigger sizes: 20px to 60px
        var duration = Math.random() * 5 + 4; // 4 to 9 seconds
        var rotateStart = Math.random() * 360;
        var rotateEnd = Math.random() * 360;
        
        item.css({
          'left': leftPos + 'vw',
          'font-size': size + 'px',
          'transform': 'rotate(' + rotateStart + 'deg)',
          'transition': 'top ' + duration + 's linear, transform ' + duration + 's linear',
          'top': '-15%'
        });
        
        $('#trash-container').append(item);
        
        // Trigger animation
        setTimeout(function() {
          item.css({
            'top': '110%', 
            'transform': 'rotate(' + rotateEnd + 'deg)'
          });
        }, 50);

        // Remove element after animation finishes
        setTimeout(() => item.remove(), (duration + 1) * 1000);
      }

      // Create items frequently
      setInterval(createBgItem, 300);


      // --- PRANK TEXTS ---
      const prankTexts = [
        "Yahan Kitna Ganda Hai!", "Ghar Kitna Ganda Hai!", 
        "Tum log gande ho!", "Kitchen faila hai!", 
        "Arish gande mein nhaao!", "Sufia Kitna Ghar failai Hai!", 
        "Sabaiya tae saaf kar!", "humko jhadu do!", 
        "Shama to ekadami loor Hai!", "Safai karbo!", 
        "Ee kachra feko!", "Bhai gande mein baithe ho!", 
        "Khadija jhadu do!", "Sara Ghar ganda Hain!", 
        "Tum log Kitna kam failati ho!", "Ghr hai k kura khana!",
        "Jhadu kaha hai?!", "Pochha lagao jaldi!",
        "Dustbin full hai!", "Papa dekho kuda felai hai shama!",
        "Safai Abhiyan Zindabad!"
      ];

      var hasMoved = false;

      function moveButton() {
        if (!hasMoved) {
          $('#noBtn').appendTo('body');
          hasMoved = true;
        }

        var randomText = prankTexts[Math.floor(Math.random() * prankTexts.length)];
        $('#noBtn').text(randomText);

        var btnWidth = $('#noBtn').outerWidth();
        var btnHeight = $('#noBtn').outerHeight();
        var windowWidth = $(window).width();
        var windowHeight = $(window).height();

        // Safety margins
        var maxLeft = windowWidth - btnWidth - 20;
        var maxTop = windowHeight - btnHeight - 20;

        if (maxLeft < 0) maxLeft = 0;
        if (maxTop < 0) maxTop = 0;

        var newLeft = Math.random() * (maxLeft - 20) + 20;
        var newTop = Math.random() * (maxTop - 20) + 20;

        $('#noBtn').css({
          'position': 'fixed',
          'left': newLeft + 'px',
          'top': newTop + 'px',
          'right': 'auto'
        });
      }

      // Handle touch and click for No button
      $('#noBtn').on('mouseenter touchstart', function(e) {
        e.preventDefault();
        moveButton();
      });

      $('#noBtn').click(function(e) {
        e.preventDefault();
        moveButton();
      });

      // --- YES BUTTON (CONFETTI TRIGGER) ---
      $('#yesBtn').click(function() {
        $('#noBtn').remove(); 
        
        $('#main-content').fadeOut(500, function() {
          $('#success-container').fadeIn(500);
          
          // --- CONFETTI EXPLOSION ---
          var duration = 4000;
          var animationEnd = Date.now() + duration;
          var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 99999 };

          var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            
            // Trash Colors: Grey, Brown, Green, Rusty Orange
            var trashColors = ['#616161', '#795548', '#2e7d32', '#d84315', '#a1887f'];
            
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 } 
            }));
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 } 
            }));
          }, 250);
        });
      });

    });
  </script>

</body>
</html>
