<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safai Abhyaan Mission! 🧹</title>
  
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #4e342e; /* Dark Brown Base */
      
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* --- ANIMATED WALLPAPER (CSS) --- */
    /* This creates a scrolling 'dirty' texture effect */
    .animated-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Crumpled paper texture */
      background: url('https://images.unsplash.com/photo-1584713503693-bb386ec95cf2?q=80&w=1974&auto=format&fit=crop');
      background-size: cover;
      opacity: 0.6;
      z-index: -2;
    }

    /* --- FLOATING TRASH ANIMATION --- */
    /* This container will hold all the falling garbage */
    #trash-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .bg-item {
      position: absolute;
      top: -10%;
      opacity: 0.9;
      z-index: 0;
      pointer-events: none;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    /* --- DUSTBIN CARD --- */
    .dustbin-card {
      background-color: #616161; /* Grey Bin */
      /* Plastic texture */
      background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.2) 20px, rgba(0,0,0,0.2) 25px);
      
      border-radius: 10px 10px 50px 50px;
      border-top: 25px solid #424242; /* Bin Rim */
      border-left: 5px solid #424242;
      border-right: 5px solid #424242;
      border-bottom: 5px solid #424242;
      
      padding: 30px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 90%;
      width: 400px;
      color: white;
    }

    /* Handles */
    .dustbin-card::before, .dustbin-card::after {
        content: '';
        position: absolute;
        top: 60px;
        width: 15px;
        height: 40px;
        background: #424242;
        border-radius: 5px;
        box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
    }
    .dustbin-card::before { left: -15px; }
    .dustbin-card::after { right: -15px; }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #fff;
      font-size: 1.8rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px 4px #000;
      line-height: 1.3;
      border-bottom: 2px dashed rgba(255,255,255,0.3);
      padding-bottom: 15px;
    }

    .btn-container {
      position: relative;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .btn-custom {
      border-radius: 10px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-family: 'Fredoka One', cursive;
      border: 2px solid #bdbdbd;
      box-shadow: 0 5px 10px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    #yesBtn {
      background-color: #757575;
      color: #fff; 
      z-index: 100;
    }
    #yesBtn:hover { background-color: #9e9e9e; }

    #noBtn {
      background-color: #d84315; /* Warning Orange */
      color: #fff;
      position: absolute; 
      right: 10px; 
      z-index: 9999;
      transition: none; 
      white-space: normal; 
      max-width: 140px;
      font-size: 0.9rem;
      line-height: 1.1;
      padding: 10px 15px;
    }

    #success-container {
      display: none;
      text-align: center;
      z-index: 20;
    }

    #success-container h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: #ffca28; /* Gold/Yellow text */
      margin-top: 20px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #000;
    }

    .image-composite {
        position: relative;
        width: 260px;
        height: 260px;
        margin: 0 auto;
        background: #fff;
        padding: 8px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        transform: rotate(-2deg);
    }

    .main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* --- BROOM ICON --- */
    .broom-overlay {
        position: absolute;
        bottom: -20px;
        right: -40px;
        width: 150px; 
        transform: rotate(-10deg);
        filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.5));
        z-index: 20;
        pointer-events: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="animated-bg"></div>
  
  <div id="trash-container"></div>
  
  <canvas id="confetti-canvas"></canvas>

  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%;">
    
    <div class="dustbin-card" id="main-content">
      <h1>Miss Taiba jhadu safai abhyaan hai? 🧹🧐</h1>
      
      <div class="btn-container">
        <button id="yesBtn" class="btn btn-custom">Haan hu! 😤</button>
        
        <button id="noBtn" class="btn btn-custom">Nahi...</button>
      </div>
    </div>

    <div class="dustbin-card" id="success-container">
      
      <div class="image-composite">
          <img src="image_2.jpg" alt="Taiba" class="main-photo">
          
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Broom_icon.svg/512px-Broom_icon.svg.png" alt="Jhadu" class="broom-overlay">
      </div>
      
      <h2>Safai maharani Taiba!!! 👑🧹</h2>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

  <script>
    $(document).ready(function() {
      
      // --- ANIMATED WALLPAPER GENERATOR ---
      // This script creates the falling trash effect automatically
      const items = ['🧹', '💨', '🗑️', '💩', '🦠', '🧽', '🥡', '🧴', '🍌', '📄'];
      
      function createBgItem() {
        const item = $('<div class="bg-item"></div>');
        item.text(items[Math.floor(Math.random() * items.length)]);
        
        // Randomize start position
        var leftPos = Math.random() * 100;
        var size = Math.random() * 30 + 20; // Size between 20px and 50px
        var duration = Math.random() * 5 + 5; // Fast fall (5-10 seconds)
        var rotateEnd = Math.random() * 360; // Random rotation
        
        item.css({
          'left': leftPos + 'vw',
          'font-size': size + 'px',
          'transition': 'top ' + duration + 's linear, transform ' + duration + 's linear',
          'top': '-10%',
          'transform': 'rotate(0deg)'
        });
        
        $('#trash-container').append(item);
        
        // Trigger animation frame
        setTimeout(function() {
          item.css({
            'top': '110%', // Move to bottom
            'transform': 'rotate(' + rotateEnd + 'deg)'
          });
        }, 100);

        // Cleanup after animation
        setTimeout(() => item.remove(), duration * 1000);
      }

      // Create a lot of trash falling quickly!
      setInterval(createBgItem, 200);

      // --- PRANK TEXTS ---
      const prankTexts = [
        "Yahan Kitna Ganda Hai!", "Ghar Kitna Ganda Hai!", 
        "Tum log gande ho!", "Kitchen faila hai!", 
        "Arish gande mein nhaao!", "Sufia Kitna Ghar failai Hai!", 
        "Sabaiya tae saaf kar!", "humko jhadu do!", 
        "Shama to ekadami loor Hai!", "Safai karbo!", 
        "Ee kachra feko!", "Bhai gande mein baithe ho!", 
        "Khadija jhadu do!", "Sara Ghar ganda Hain!", 
        "Tum log Kitna kam failati ho!", "Ghr hai k kura khana!",
        "Jhadu kaha hai?!", "Pochha lagao jaldi!",
        "Dustbin full hai!", "Papa dekho kuda felai hai shama!",
        "Safai Abhiyan Zindabad!"
      ];

      var hasMoved = false;

      function moveButton() {
        if (!hasMoved) {
          $('#noBtn').appendTo('body');
          hasMoved = true;
        }

        var randomText = prankTexts[Math.floor(Math.random() * prankTexts.length)];
        $('#noBtn').text(randomText);

        var btnWidth = $('#noBtn').outerWidth();
        var btnHeight = $('#noBtn').outerHeight();
        var windowWidth = $(window).width();
        var windowHeight = $(window).height();

        var maxLeft = windowWidth - btnWidth - 30;
        var maxTop = windowHeight - btnHeight - 30;

        if (maxLeft < 0) maxLeft = 0;
        if (maxTop < 0) maxTop = 0;

        var newLeft = Math.random() * (maxLeft - 30) + 30;
        var newTop = Math.random() * (maxTop - 30) + 30;

        $('#noBtn').css({
          'position': 'fixed',
          'left': newLeft + 'px',
          'top': newTop + 'px',
          'right': 'auto'
        });
      }

      $('#noBtn').on('mouseenter touchstart', function(e) {
        e.preventDefault();
        moveButton();
      });

      $('#noBtn').click(function(e) {
        e.preventDefault();
        moveButton();
      });

      // --- YES BUTTON ---
      $('#yesBtn').click(function() {
        $('#noBtn').remove(); 
        
        $('#main-content').fadeOut(500, function() {
          $('#success-container').fadeIn(500);
          
          var duration = 4000;
          var animationEnd = Date.now() + duration;
          var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

          var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            
            // "Trash" colors for confetti (Grey, Brown, Green)
            var trashColors = ['#616161', '#795548', '#2e7d32', '#9e9e9e', '#a1887f'];
            
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 } 
            }));
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 } 
            }));
          }, 250);
        });
      });

    });
  </script>

</body>
</html>
