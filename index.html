<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Safai Abhyaan Mission! 🧹</title>
  
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      
      /* --- WALLPAPER: Trash Pile (Wikimedia Source - Very Stable) --- */
      background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Garbage_dump_in_Saipan.jpg/1280px-Garbage_dump_in_Saipan.jpg') no-repeat center center fixed;
      background-size: cover;
      
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Dark overlay to ensure text is readable over the messy background */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6); /* Darker dim */
      z-index: -1;
    }

    /* Floating Background Items */
    .bg-item {
      position: absolute;
      top: -10%;
      font-size: 35px;
      opacity: 0.8;
      animation: floatDown 15s linear infinite;
      z-index: 0;
      pointer-events: none;
      text-shadow: 2px 2px 4px #000;
    }

    @keyframes floatDown {
      0% { transform: translateY(-10vh) translateX(-10vw) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(110vh) translateX(10vw) rotate(720deg); opacity: 0; }
    }

    /* --- THE DUSTBIN CARD DESIGN --- */
    .dustbin-card {
      /* Green Plastic Bin Color */
      background-color: #2e7d32; 
      
      /* CSS Trick to make vertical "Ridges" like a plastic bin */
      background-image: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 20px,
        rgba(0, 0, 0, 0.1) 20px,
        rgba(0, 0, 0, 0.1) 40px
      );
      
      border-radius: 15px 15px 30px 30px; /* Rounded bottom like a bin */
      border: 5px solid #1b5e20;
      border-top: 15px solid #1b5e20; /* Thick rim at top */
      
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
      position: relative;
      z-index: 10;
      max-width: 90%;
      width: 450px;
      color: white; /* Text must be white on green */
    }

    h1 {
      font-family: 'Fredoka One', cursive;
      color: #fff; /* White text */
      font-size: 2rem;
      margin-bottom: 25px;
      text-shadow: 2px 2px 0px #000;
      line-height: 1.3;
    }

    .btn-container {
      position: relative;
      height: 100px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .btn-custom {
      border-radius: 15px;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-family: 'Fredoka One', cursive;
      border: 2px solid #fff;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: all 0.1s ease;
    }

    #yesBtn {
      background-color: #fff;
      color: #2e7d32; /* Green text */
      z-index: 100;
    }

    #noBtn {
      background-color: #d84315; /* Rusty Orange */
      color: #fff;
      position: absolute; 
      right: 10px; 
      z-index: 9999;
      transition: none; 
      white-space: normal; 
      max-width: 140px;
      font-size: 0.9rem;
      line-height: 1.1;
      padding: 10px 15px;
    }

    #success-container {
      display: none;
      text-align: center;
      z-index: 20;
    }

    #success-container h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: #ffeb3b; /* Yellow text for contrast */
      margin-top: 20px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0px #000;
    }

    .image-composite {
        position: relative;
        width: 280px;
        height: 280px;
        margin: 0 auto;
        background: #fff; /* White frame for photo */
        padding: 10px;
        border-radius: 10px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }

    .main-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* --- FIXED BROOM IMAGE --- */
    /* Using Wikimedia Commons URL - extremely stable */
    .broom-overlay {
        position: absolute;
        bottom: -20px;
        right: -40px;
        width: 160px; 
        transform: rotate(-10deg);
        filter: drop-shadow(5px 5px 5px rgba(0,0,0,0.5));
        z-index: 20;
        pointer-events: none;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="overlay"></div>
  <canvas id="confetti-canvas"></canvas>

  <div style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100%;">
    
    <div class="dustbin-card" id="main-content">
      <h1>Miss Taiba jhadu safai abhyaan hai? 🧹🧐</h1>
      
      <div class="btn-container">
        <button id="yesBtn" class="btn btn-custom">Haan hu! 😤</button>
        
        <button id="noBtn" class="btn btn-custom">Nahi...</button>
      </div>
    </div>

    <div class="dustbin-card" id="success-container">
      
      <div class="image-composite">
          <img src="image_2.jpg" alt="Taiba" class="main-photo">
          
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Broom_icon.svg/1024px-Broom_icon.svg.png" alt="Jhadu" class="broom-overlay">
      </div>
      
      <h2>Safai maharani Taiba!!! 👑🧹</h2>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>

  <script>
    $(document).ready(function() {
      
      // --- Background Items ---
      const items = ['🧹', '💨', '🗑️', '💩', '🦠', '🧽'];
      function createBgItem() {
        const item = $('<div class="bg-item"></div>');
        item.text(items[Math.floor(Math.random() * items.length)]);
        var leftPos = Math.random() * 100;
        var size = Math.random() * 25 + 15;
        var duration = Math.random() * 10 + 10;
        item.css({
          'left': leftPos + 'vw',
          'font-size': size + 'px',
          'animation-duration': duration + 's'
        });
        $('body').append(item);
        setTimeout(() => item.remove(), duration * 1000);
      }
      setInterval(createBgItem, 400);

      // --- PRANK TEXTS ---
      const prankTexts = [
        "Yahan Kitna Ganda Hai!", 
        "Ghar Kitna Ganda Hai!", 
        "Tum log gande ho!", 
        "Kitchen faila hai!", 
        "Arish gande mein nhaao!", 
        "Sufia Kitna Ghar failai Hai!", 
        "Sabaiya tae saaf kar!", 
        "humko jhadu do!", 
        "Shama to ekadami loor Hai!", 
        "Safai karbo!", 
        "Ee kachra feko!", 
        "Bhai gande mein baithe ho!", 
        "Khadija jhadu do!", 
        "Sara Ghar ganda Hain!", 
        "Tum log Kitna kam failati ho!", 
        "Ghr hai k kura khana!",
        "Jhadu kaha hai?!", 
        "Pochha lagao jaldi!",
        "Dustbin full hai!", 
        "Papa dekho kuda felai hai shama!",
        "Safai Abhiyan Zindabad!"
      ];

      var hasMoved = false;

      function moveButton() {
        if (!hasMoved) {
          $('#noBtn').appendTo('body');
          hasMoved = true;
        }

        var randomText = prankTexts[Math.floor(Math.random() * prankTexts.length)];
        $('#noBtn').text(randomText);

        var btnWidth = $('#noBtn').outerWidth();
        var btnHeight = $('#noBtn').outerHeight();
        var windowWidth = $(window).width();
        var windowHeight = $(window).height();

        var maxLeft = windowWidth - btnWidth - 30;
        var maxTop = windowHeight - btnHeight - 30;

        if (maxLeft < 0) maxLeft = 0;
        if (maxTop < 0) maxTop = 0;

        var newLeft = Math.random() * (maxLeft - 30) + 30;
        var newTop = Math.random() * (maxTop - 30) + 30;

        $('#noBtn').css({
          'position': 'fixed',
          'left': newLeft + 'px',
          'top': newTop + 'px',
          'right': 'auto'
        });
      }

      $('#noBtn').on('mouseenter touchstart', function(e) {
        e.preventDefault();
        moveButton();
      });

      $('#noBtn').click(function(e) {
        e.preventDefault();
        moveButton();
      });

      // --- YES BUTTON ---
      $('#yesBtn').click(function() {
        $('#noBtn').remove(); 
        
        $('#main-content').fadeOut(500, function() {
          $('#success-container').fadeIn(500);
          
          var duration = 4000;
          var animationEnd = Date.now() + duration;
          var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 9999 };

          var interval = setInterval(function() {
            var timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);
            var particleCount = 50 * (timeLeft / duration);
            
            // "Trash" colors for confetti
            var trashColors = ['#5d4037', '#7cb342', '#757575', '#8d6e63', '#a1887f'];
            
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.1, y: Math.random() - 0.2 } 
            }));
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                colors: trashColors,
                origin: { x: Math.random() * 0.2 + 0.7, y: Math.random() - 0.2 } 
            }));
          }, 250);
        });
      });

    });
  </script>

</body>
</html>
